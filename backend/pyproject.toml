[project]
name = "sudoku-backend"
version = "1.0.0"
description = "FastAPI backend for the Sudoku Telegram Mini App"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.162.3",
    "pydantic-settings==2.16.2",
    "SQLAlchemy[asyncio]==2.0.49",
    "uvicorn==0.54.0",
    # uvicorn has no WebSocket protocol of its own: without this, every upgrade is HTTP 404.
    "websockets==17.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "hypothesis==6.170.15",
    "mypy==2.4.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: seeded generate_puzzle cases",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PL", "ASYNC", "RUF"]
ignore = [
    "B008",    # FastAPI dependency injection uses calls in defaults
    "PLR2004", # magic numbers: sudoku digits and grid sizes are the domain
]
# En dash is the prose dash. RUF001 and RUF003 otherwise treat it as a confusable.
allowed-confusables = ["–"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["I"]
"tests/**" = ["ARG001", "PLR0913", "PLR0915"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app"]
