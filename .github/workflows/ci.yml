name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sudoku
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sudoku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sudoku -d sudoku_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sudoku:test@localhost:5432/sudoku_test
      BOT_TOKEN: "123456:ABC-DEF"
      DOMAIN: sudoku.murik.dev
      WEBAPP_URL: https://sudoku.murik.dev
      ALLOWED_ORIGINS: '["https://sudoku.murik.dev"]'
      TELEGRAM_USE_POLLING: "false"
      TELEGRAM_BOT_ENABLED: "false"
      ADMIN_TELEGRAM_IDS: ""
      TELEGRAM_WEBHOOK_SECRET: "test_webhook_secret"
      PUZZLE_POOL_REFILL_ENABLED: "false"
      PUZZLE_POOL_TARGET_SIZE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check . ../deploy
      - run: uv run ruff format --check . ../deploy
      - run: uv run mypy app ../deploy/*.py
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Deploy builds these Dockerfiles. The jobs above never run them, so a broken COPY only fails on the server.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Build the ${{ matrix.name }} image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --tag sudoku-${{ matrix.name }} ${{ matrix.context }}
