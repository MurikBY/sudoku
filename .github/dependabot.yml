version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7: openapi-typescript 7.13 does not accept it yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # plugin-react 6 needs a newer Vite major than this project runs.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # Node types follow the Node runtime, which moves by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # A new Python needs wheels for every compiled dependency, so the runtime moves by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # A new PostgreSQL major needs a dump and restore, so it moves by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # docker-compose.dev.yml runs the client on the same Node major as the image.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The Node runtime moves by hand, together with CI and @types/node.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
